{% extends "base.html" %}

{% block title %}Registro - {{ super() }}{% endblock %}

{% block extra_styles %}
<style>
    body { background-color: #f8f9fa; }
    .register-card {
        margin-top: 30px; /* Un poco menos que login */
        background-color: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
     .form-check-label { cursor: pointer; }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="register-card">
            <h2 class="text-center mb-4">Crear Cuenta</h2>
            {# Los mensajes flash ya están en base.html #}
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre Completo o Razón Social</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required aria-describedby="passwordHelp">
                    <div id="passwordHelp" class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Quiero registrarme como:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="user_type" id="provider" value="provider" {% if user_type == 'provider' or not user_type %}checked{% endif %} required>
                        <label class="form-check-label" for="provider">
                            Prestador de Servicios (Proveedor)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="user_type" id="buyer" value="buyer" {% if user_type == 'buyer' %}checked{% endif %} required>
                        <label class="form-check-label" for="buyer">
                            Comprador (Cliente)
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>
             <div class="mt-3 text-center">
                <p>¿Ya tienes una cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
